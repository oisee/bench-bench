# Benchmark participants. Model, provider and harness are separate fields.
# Launch: bin/sandbox.sh --harness H --provider P --model M --effort E

executors:
  # --- Z.ai Coding Max: harness effect on one model ---
  - {id: zai-glm53-pi,      provider: zai,     model: glm-5.3,        harness: pi,     effort: high}
  - {id: zai-glm53-claude,  provider: zai,     model: "glm-5.3[1m]",  harness: claude, effort: high}
  - {id: zai-glm53-codex,   provider: zai,     model: glm-5.3,        harness: codex,  effort: high}
  # not available on the plan (model_access_denied):
  # - {id: zai-glm53f-pi,     provider: zai,     model: glm-5.3-flash,  harness: pi,     effort: high}   # cheap tier

  # --- Alibaba Coding Plan Pro: model effect with one harness ---
  - {id: ali-qwen37-pi,     provider: alibaba, model: qwen3.7-plus,   harness: pi,     effort: high}
  - {id: ali-kimi25-pi,     provider: alibaba, model: kimi-k2.5,      harness: pi,     effort: high}
  - {id: ali-minimax25-pi,  provider: alibaba, model: MiniMax-M2.5,   harness: pi,     effort: high}
  - {id: ali-glm5-pi,       provider: alibaba, model: glm-5,          harness: pi,     effort: high}   # GLM-5 vs GLM-5.3 (Z.ai)
  # L2 extension: the same Alibaba models through Codex and the LiteLLM bridge.
  - {id: ali-qwen37-codex,  provider: alibaba, model: qwen3.7-plus,   harness: codex,  effort: medium}
  - {id: ali-kimi25-codex,  provider: alibaba, model: kimi-k2.5,      harness: codex,  effort: medium}
  - {id: ali-minimax25-codex, provider: alibaba, model: MiniMax-M2.5, harness: codex,  effort: medium}
  # a second harness for the best Alibaba model, to add after L1:
  # - {id: ali-qwen37-claude, provider: alibaba, model: qwen3.7-plus, harness: claude, effort: high}

  # --- Azure OpenAI ---
  - {id: az-sol61-codex,    provider: azure,   model: gpt-6.1-sol,    harness: codex,  effort: medium}

  # --- OpenAI (subscription) · gpt-6-luna in Codex, three effort levels ---
  - {id: oai-luna-codex-m,  provider: openai,  model: gpt-6-luna,     harness: codex,  effort: medium}
  - {id: oai-luna-codex-h,  provider: openai,  model: gpt-6-luna,     harness: codex,  effort: high}
  - {id: oai-luna-codex-x,  provider: openai,  model: gpt-6-luna,     harness: codex,  effort: xhigh}

  # --- Round 3: harness experiments (bin/run-visible.sh, bin/run.sh for the effort row) ---
  - {id: az-sol61-codex-hi,     provider: azure,  model: gpt-6.1-sol, harness: codex, effort: high}
  - {id: az-sol61-codex-gate,   provider: azure,  model: gpt-6.1-sol, harness: codex, effort: medium}
  - {id: oai-luna-codex-m-vis,  provider: openai, model: gpt-6-luna,  harness: codex, effort: medium}
  - {id: oai-luna-codex-h-vis,  provider: openai, model: gpt-6-luna,  harness: codex, effort: high}

  # --- Your own model: provider custom = the OpenAI/Anthropic-compatible endpoint in .env ---
  # Copy a line, change id and model; harness claude, codex or pi. Then: bin/bench.sh <id>
  - {id: custom-qwen38fn-claude, provider: custom, model: Qwen3.8-Flash-Next, harness: claude, effort: xhigh}
  - {id: custom-qwen38fn-pi,     provider: custom, model: Qwen3.8-Flash-Next, harness: pi,     effort: xhigh}
  # Qwen3.8-27B (dense) on i7: 2x RTX 4060 Ti 16 GB, llama.cpp, unsloth UD-Q4_K_XL. Endpoint from the command line:
  #   CUSTOM_BASE_URL=http://192.168.8.107:8081/v1 CUSTOM_CONTEXT_WINDOW=190000 bin/bench.sh custom-qwen38-27b-claude
  - {id: custom-qwen38-27b-claude, provider: custom, model: qwen3.8-27b-q4kxl, harness: claude, effort: xhigh}
  # Qwen3.8-Flash-Next on i7 (track B): unsloth UD-IQ4_XS, llama.cpp --fit (hot experts on 2x 4060 Ti, rest in RAM):
  #   CUSTOM_BASE_URL=http://192.168.8.107:8081/v1 CUSTOM_CONTEXT_WINDOW=262144 BENCH_TIME_SCALE=10 bin/bench.sh custom-qwen38fn-iq4-i7-claude
  - {id: custom-qwen38fn-iq4-i7-claude, provider: custom, model: qwen3.8-flash-next-iq4xs, harness: claude, effort: xhigh}
  # ISTA-DASLab GSQ-RCO-Coder (256/512 experts, ~3.5 bpw) cut to 224 by cnm, on i7 (~35 tok/s decode):
  #   CUSTOM_BASE_URL=http://192.168.8.107:8081/v1 CUSTOM_CONTEXT_WINDOW=190000 BENCH_TIME_SCALE=5 bin/bench.sh custom-qwen38fn-k224-i7-claude
  - {id: custom-qwen38fn-k224-i7-claude, provider: custom, model: qwen3.8-flash-next-dslab-k224, harness: claude, effort: xhigh}
  # K224 variants (same cut, other server settings): MTP head + n-gram drafts; the same at temperature 0; n-gram only at temperature 0.6:
  #   CUSTOM_BASE_URL=http://192.168.8.107:8081/v1 CUSTOM_CONTEXT_WINDOW=190000 BENCH_TIME_SCALE=5 BENCH_RECORD=1 bin/bench.sh custom-qwen38fn-k224-mtp-ng-i7-claude
  - {id: custom-qwen38fn-k224-mtp-ng-i7-claude, provider: custom, model: qwen3.8-flash-next-dslab-k224-mtp-ng, harness: claude, effort: xhigh}
  #   CUSTOM_BASE_URL=http://192.168.8.107:8081/v1 CUSTOM_CONTEXT_WINDOW=190000 BENCH_TIME_SCALE=5 BENCH_RECORD=1 bin/bench.sh custom-qwen38fn-k224-mtp-ng-t0-i7-claude
  - {id: custom-qwen38fn-k224-mtp-ng-t0-i7-claude, provider: custom, model: qwen3.8-flash-next-dslab-k224-mtp-ng-t0, harness: claude, effort: xhigh}
  #   CUSTOM_BASE_URL=http://192.168.8.107:8081/v1 CUSTOM_CONTEXT_WINDOW=190000 BENCH_TIME_SCALE=5 BENCH_RECORD=1 bin/bench.sh custom-qwen38fn-k224-ng-t06-i7-claude
  - {id: custom-qwen38fn-k224-ng-t06-i7-claude, provider: custom, model: qwen3.8-flash-next-dslab-k224-ng-t06, harness: claude, effort: xhigh}
  # K224 with 16 experts per layer replaced by session-ranked ones (data/expert-sets/qwen38fn-224-implant16.json), 3.5-bit GGUF:
  #   CUSTOM_BASE_URL=http://192.168.8.107:8081/v1 CUSTOM_CONTEXT_WINDOW=190000 BENCH_TIME_SCALE=5 BENCH_RECORD=1 bin/bench.sh custom-qwen38fn-implant16-i7-claude
  - {id: custom-qwen38fn-implant16-i7-claude, provider: custom, model: qwen3.8-flash-next-k224-implant16, harness: claude, effort: xhigh}
  # DSLab cut to 192 experts (a subset of the 224): MTP + n-gram; full MTP head with V cache q5_1 (q51); Q4 MTP head, nothing
  # spilled to RAM (q4h); and 192p = 192 chosen inside the 224 with protection for decision tokens, Q4 MTP head:
  #   CUSTOM_BASE_URL=http://192.168.8.107:8081/v1 CUSTOM_CONTEXT_WINDOW=190000 BENCH_TIME_SCALE=5 BENCH_RECORD=1 bin/bench.sh custom-qwen38fn-dslab192-mtp-i7-claude
  - {id: custom-qwen38fn-dslab192-mtp-i7-claude, provider: custom, model: qwen3.8-flash-next-dslab192-mtp-ng, harness: claude, effort: xhigh}
  #   CUSTOM_BASE_URL=http://192.168.8.107:8081/v1 CUSTOM_CONTEXT_WINDOW=190000 BENCH_TIME_SCALE=5 BENCH_RECORD=1 bin/bench.sh custom-qwen38fn-dslab192-q51-i7-claude
  - {id: custom-qwen38fn-dslab192-q51-i7-claude, provider: custom, model: qwen3.8-flash-next-dslab192-mtp-q51, harness: claude, effort: xhigh}
  #   CUSTOM_BASE_URL=http://192.168.8.107:8081/v1 CUSTOM_CONTEXT_WINDOW=190000 BENCH_TIME_SCALE=5 BENCH_RECORD=1 bin/bench.sh custom-qwen38fn-dslab192-q4h-i7-claude
  - {id: custom-qwen38fn-dslab192-q4h-i7-claude, provider: custom, model: qwen3.8-flash-next-dslab192-q4h, harness: claude, effort: xhigh}
  #   CUSTOM_BASE_URL=http://192.168.8.107:8081/v1 CUSTOM_CONTEXT_WINDOW=190000 BENCH_TIME_SCALE=5 BENCH_RECORD=1 bin/bench.sh custom-qwen38fn-dslab192p-i7-claude
  - {id: custom-qwen38fn-dslab192p-i7-claude, provider: custom, model: qwen3.8-flash-next-dslab192p-q4h, harness: claude, effort: xhigh}
  # K192p-implant16 (HF: oisee/Qwen3.8-Flash-Next-GSQ-RCO-Coder-192E-implant16-GGUF), MTP Q4 head + n-gram:
  #   CUSTOM_BASE_URL=http://192.168.8.107:8081/v1 CUSTOM_CONTEXT_WINDOW=190000 BENCH_TIME_SCALE=5 BENCH_RECORD=1 bin/bench.sh custom-qwen38fn-k192pimp16-i7-claude
  - {id: custom-qwen38fn-k192pimp16-i7-claude, provider: custom, model: qwen3.8-flash-next-k192p-implant16, harness: claude, effort: xhigh}
  # 2-bit cuts from DSLab's IQ2_XS 512-expert build: 192 and 280 experts, MTP + n-gram:
  #   CUSTOM_BASE_URL=http://192.168.8.107:8081/v1 CUSTOM_CONTEXT_WINDOW=190000 BENCH_TIME_SCALE=5 BENCH_RECORD=1 bin/bench.sh custom-qwen38fn-iq2-dslab192-mtp-i7-claude
  - {id: custom-qwen38fn-iq2-dslab192-mtp-i7-claude, provider: custom, model: qwen3.8-flash-next-iq2-dslab192-mtp, harness: claude, effort: xhigh}
  #   CUSTOM_BASE_URL=http://192.168.8.107:8081/v1 CUSTOM_CONTEXT_WINDOW=190000 BENCH_TIME_SCALE=5 BENCH_RECORD=1 bin/bench.sh custom-qwen38fn-iq2-dslab280-mtp-i7-claude
  - {id: custom-qwen38fn-iq2-dslab280-mtp-i7-claude, provider: custom, model: qwen3.8-flash-next-iq2-dslab280-mtp, harness: claude, effort: xhigh}
  # Qwen3.8-27B dense, unsloth UD-Q4_K_XL with an MTP head:
  #   CUSTOM_BASE_URL=http://192.168.8.107:8081/v1 CUSTOM_CONTEXT_WINDOW=190000 BENCH_TIME_SCALE=5 BENCH_RECORD=1 bin/bench.sh custom-qwen38-27b-mtp-i7-claude
  - {id: custom-qwen38-27b-mtp-i7-claude, provider: custom, model: qwen3.8-27b-q4kxl-mtp, harness: claude, effort: xhigh}
  # Candidate small local models on i7, all in VRAM; llama.cpp, Q4, 131K context, vendor sampling:
  #   CUSTOM_BASE_URL=http://192.168.8.107:8081/v1 CUSTOM_CONTEXT_WINDOW=131072 BENCH_TIME_SCALE=5 BENCH_RECORD=1 bin/bench.sh custom-cand-ornith-i7-claude
  - {id: custom-cand-ornith-i7-claude, provider: custom, model: cand-ornith, harness: claude, effort: xhigh}
  #   CUSTOM_BASE_URL=http://192.168.8.107:8081/v1 CUSTOM_CONTEXT_WINDOW=131072 BENCH_TIME_SCALE=5 BENCH_RECORD=1 bin/bench.sh custom-cand-flint-i7-claude
  - {id: custom-cand-flint-i7-claude, provider: custom, model: cand-flint, harness: claude, effort: xhigh}
  #   CUSTOM_BASE_URL=http://192.168.8.107:8081/v1 CUSTOM_CONTEXT_WINDOW=131072 BENCH_TIME_SCALE=5 BENCH_RECORD=1 bin/bench.sh custom-cand-nemotron-i7-claude
  - {id: custom-cand-nemotron-i7-claude, provider: custom, model: cand-nemotron, harness: claude, effort: xhigh}
  #   CUSTOM_BASE_URL=http://192.168.8.107:8081/v1 CUSTOM_CONTEXT_WINDOW=131072 BENCH_TIME_SCALE=5 BENCH_RECORD=1 bin/bench.sh custom-cand-muse-i7-claude
  - {id: custom-cand-muse-i7-claude, provider: custom, model: cand-muse, harness: claude, effort: xhigh}

  # --- Control (Anthropic subscription) ---
  - {id: ant-opus-claude,   provider: anthropic, model: opus,         harness: claude, effort: high}

# Codex astra (medium) drafts the briefs; jury critics all run at high.
helpers:
  case_assistant: {provider: openai, harness: codex, model: gpt-6-astra, effort: medium}

critics:
  - {id: K1-astra, provider: openai,    model: gpt-6-astra, harness: codex,  effort: high}
  - {id: K2-sol,   provider: openai,    model: gpt-6-sol,   harness: codex,  effort: high}
  - {id: K3-opus,  provider: anthropic, model: opus,        harness: claude, effort: high, self_family: [ant-]}
  - {id: K4-glm,   provider: zai,       model: glm-5.3,     harness: pi,     effort: high, self_family: [zai-glm, ali-glm]}

# Blind critic screening (bin/critic-screen.sh): no hidden-test results, separate runs/_screen.
screen_critics:
  - {id: S-opus,  provider: anthropic, model: opus,          harness: claude, effort: high,  self_family: [ant-]}
  - {id: S-fable, provider: anthropic, model: fable,         harness: claude, effort: high,  self_family: [ant-]}
  - {id: S-sol,   provider: openai,    model: gpt-6-sol,     harness: codex,  effort: xhigh, self_family: [az-sol]}
  - {id: S-glm,   provider: zai,       model: "glm-5.3[1m]", harness: claude, effort: high,  self_family: [zai-glm, ali-glm]}
  - {id: S-glm-pi,  provider: zai,     model: glm-5.3,       harness: pi,     effort: high,  self_family: [zai-glm, ali-glm]}
  - {id: S-qwen-pi, provider: alibaba, model: qwen3.7-plus,  harness: pi,     effort: high,  self_family: [ali-qwen]}

limits:
  wall_clock_min: {L1: 30, L2: 45, L3: 60}
  human_interventions: 0      # the agent works alone after receiving the brief
  repeats: 1                  # pilot; repeats after L1
